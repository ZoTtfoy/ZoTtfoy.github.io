<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- ===================================================================
       综合纹章 · 第二版（2026-11-13）
       六组线索性符号，对应这个人的六个面：
         维修(齿轮) · 音乐(波形) · 电子(电路) ·
         数码(芯片) · 生活(叶片) · 游戏(十字键)
       全部线性笔画、不填色：作为 CSS mask 使用时按 alpha 取值，
       最终颜色由 .ambient__motif 的 background-color 决定，
       浅色/深色、八套风格都自动适配，不需要两份图。

       第一版有三个问题，这一版逐一改掉：
         1. 符号随手摆，波形正好压在头像后面、芯片压在引言上 ——
            改成环形构图：六组贴着四边与两腰，中间 480×320 的区域
            完全留空，那是标题 / 头像 / 按钮待的地方。
         2. 横竖长直线跨过 0/1200 边界，平铺后接不上，出现断头线 ——
            全部去掉，改成每组符号自带一小段「引线 + 端点」，
            长度不超过 50，碰不到边界。
         3. 所有符号一样大，像图标库 —— 改成 1.1~1.35 的尺寸差，
            线宽 2.6→2.2（屏幕上别太抢），引线与散点 1.6。
       =================================================================== -->
  <g fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

    <!-- ① 维修：螺丝/齿轮（左上，避开顶栏 72px） -->
    <g transform="translate(140 168) rotate(-10) scale(1.25)">
      <circle cx="50" cy="50" r="17"/>
      <circle cx="50" cy="50" r="31" stroke-dasharray="7 9"/>
      <path d="M50 19V7 M50 81v12 M19 50H7 M81 50h12 M28 28l-9-9 M72 72l9 9 M72 28l9-9 M28 72l-9 9"/>
      <circle cx="50" cy="50" r="4" fill="#000" stroke="none"/>
    </g>
    <!-- 齿轮右下的引线 -->
    <g stroke-width="1.6">
      <path d="M246 236h38"/>
      <circle cx="292" cy="236" r="3.4" fill="#000" stroke="none"/>
    </g>

    <!-- ② 音乐：波形 + 音符头（右上） -->
    <g transform="translate(902 118) rotate(6) scale(1.15)">
      <path d="M6 54h16l10-30 14 62 13-46 9 18h28"/>
      <path d="M96 30v34"/>
      <ellipse cx="89" cy="66" rx="10" ry="7" transform="rotate(-18 89 66)" fill="#000" stroke="none"/>
      <path d="M96 30c13 4 18 10 20 19"/>
    </g>
    <g stroke-width="1.6">
      <path d="M900 214v34"/>
      <circle cx="900" cy="256" r="3.4" fill="#000" stroke="none"/>
    </g>

    <!-- ③ 电子：电路走线与焊点（右侧中腰） -->
    <g transform="translate(1050 372) scale(1.2)">
      <path d="M6 22h34l18 18h34 M6 76h26l20-20h40 M58 40V12 M92 56v26"/>
      <circle cx="58" cy="10" r="5" fill="#000" stroke="none"/>
      <circle cx="92" cy="84" r="5" fill="#000" stroke="none"/>
      <circle cx="104" cy="40" r="5"/>
      <path d="M104 40l10-10"/>
    </g>

    <!-- ④ 游戏：十字键 + 两颗按键（右下） -->
    <g transform="translate(1024 610) rotate(9) scale(1.15)">
      <path d="M38 6h20v30h30v20H58v30H38V56H8V36h30Z"/>
      <circle cx="86" cy="18" r="6"/>
      <circle cx="100" cy="34" r="6"/>
    </g>
    <g stroke-width="1.6">
      <path d="M1000 604h-34"/>
      <circle cx="958" cy="604" r="3.4" fill="#000" stroke="none"/>
    </g>

    <!-- ⑤ 数码：芯片与引脚（左下） -->
    <g transform="translate(168 576) rotate(-5) scale(1.3)">
      <rect x="29" y="29" width="42" height="42" rx="7"/>
      <rect x="43" y="43" width="14" height="14" rx="2"/>
      <path d="M40 29V17 M60 29V17 M40 71v12 M60 71v12 M29 40H17 M29 60H17 M71 40h12 M71 60h12"/>
    </g>

    <!-- ⑥ 生活：叶片与叶脉（下中，落在中心留空区正下方） -->
    <g transform="translate(618 654) rotate(-8) scale(1.2)">
      <path d="M16 82C16 44 42 18 88 14 90 56 64 82 16 82Z"/>
      <path d="M16 82C32 64 52 48 76 32"/>
      <path d="M40 60l-2-16 M58 46l-2-16"/>
    </g>

    <!-- 散点：只做定位标记感，不连线、不跨边界 -->
    <g fill="#000" stroke="none">
      <circle cx="392" cy="168" r="2.6"/>
      <circle cx="704" cy="140" r="2.2"/>
      <circle cx="1012" cy="272" r="2.6"/>
      <circle cx="352" cy="452" r="2.2"/>
      <circle cx="846" cy="470" r="2.6"/>
      <circle cx="486" cy="742" r="2.2"/>
      <circle cx="928" cy="756" r="2.6"/>
      <circle cx="86" cy="404" r="2.2"/>
    </g>
  </g>
</svg>
