name: Sync external data

# 抓取站外数据写进 data/*.json，然后提交回仓库。
# 抓不到不会导致失败 —— 页面会继续用上一次的结果 / config.js 里的兜底内容。
#
# 首次使用需要配置（仓库 Settings → Secrets and variables → Actions）：
#   Secret   NETEASE_COOKIE    浏览器里 music.163.com 的完整 Cookie
#   Secret   STEAM_API_KEY     Steam Web API 密钥（免费领：steamcommunity.com/dev/apikey）
#   Variable NETEASE_UID       你的数字 UID（或直接改 config.js 的 listen.neteaseUid）
#   Variable STEAM_ID          17 位 SteamID64（不填则读 config.js 里那张 Steam 卡）
#
# 关于 Steam 的两条路：
#   · 库存抓取（封面墙用的 apps / portraitApps）必须真实浏览器 —— 裸 fetch 会被
#     TLS 指纹挡住，Actions 里跑不了。所以这条只在本机跑：
#         node scripts/sync-steam.mjs
#   · 但「游戏库统计 + 最近入库」只需要 Web API，不需要浏览器。它跑的是：
#         node scripts/sync-steam.mjs --api-only
#     --api-only 会沿用上一次本机抓的封面墙数据，只更新战绩与 owned 快照。
#     「最近入库」靠两次同步的 appid 差集算出来（Steam 接口没有购买时间字段），
#     所以这条必须每天跑 —— 断一天，那天入库的游戏就要等到下一次才被发现。
#
# 不配置也能跑：没配的项自动跳过，其余照旧。

on:
  schedule:
    # 每天 UTC 02:10 / 北京时间 10:10。GitHub 的定时任务在高峰期可能延迟十几分钟，正常。
    - cron: "10 2 * * *"
  workflow_dispatch:        # 也可以在 Actions 页面手动点一下立刻跑

permissions:
  contents: write           # 需要写权限才能把 data/*.json 提交回来

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 放到 job 层，是为了能在 step 的 if 里判断"密钥配了没"——
    # 按 GitHub 的规则，secrets 不能直接写进 if 表达式。
    env:
      NETEASE_UID: ${{ vars.NETEASE_UID }}
      NETEASE_COOKIE: ${{ secrets.NETEASE_COOKIE }}
      STEAM_ID: ${{ vars.STEAM_ID }}
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 先跑 Steam：它只依赖 API，最稳；而且「最近入库」每天都可能变，
      # 万一后面网易云那条挂了，这一条不该被牵连。
      - name: Sync Steam 战绩与最近入库（API only）
        if: env.STEAM_API_KEY != ''
        timeout-minutes: 10
        run: node scripts/sync-steam.mjs --api-only

      - name: Skip notice
        if: env.STEAM_API_KEY == ''
        run: echo "没有配置 STEAM_API_KEY，跳过 Steam 同步（页面继续用仓库里已有的 data/steam.json）"

      - name: Run sync
        timeout-minutes: 10
        run: node scripts/sync.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "数据没有变化，跳过提交"
          else
            git commit -m "chore(sync): 更新在听 / 游戏战绩 / 最近入库"
            git push
          fi
