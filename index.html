<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <!-- 隐私：不给任何第三方（Steam / 网易云的封面 CDN）发 Referer。
       默认策略（strict-origin-when-cross-origin）虽然不带路径，但仍会告诉
       对方"你是从 zottfoy.github.io 来的"。这一站没有依赖 Referer 的功能，
       所以直接关掉 —— 外链封面只应该看到"有人要这张图"。 -->
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Zotrod 的个人主页 —— 联系方式、最近在听、在玩的游戏，以及维修报价。">
  <meta name="theme-color" content="#fbfbf9">

  <!-- ═══════════════════════════════════════════════════════════════════
       社交分享标签（Open Graph + Twitter Card）
       ───────────────────────────────────────────────────────────────────
       为什么两种都写：微信 / TG / Discord / Slack 读 og:*，
       X（Twitter）在没有 twitter:* 时会退回读 og:*，但卡片类型会退化成
       普通链接（没有大图）。补上 twitter:card=summary_large_image
       才能拿到 1200×630 的大图版式。

       ⚠️ og:image 必须是**位图**和**绝对地址**：
         · 微信 / TG 的抓取器不渲染 SVG，所以用 PNG；
         · 相对路径在部分平台上解析失败，所以写全 https:// 开头。
         目标是 1200×630 —— 低于 600×315 会被某些平台裁成小图。
       ═══════════════════════════════════════════════════════════════════ -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Zotrod">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" content="Zotrod · 个人主页">
  <meta property="og:description" content="Zotrod 的个人主页 —— 联系方式、听歌排行、在玩的游戏，以及一份透明的维修报价。">
  <meta property="og:url" content="https://zottfoy.github.io/">
  <meta property="og:image" content="https://zottfoy.github.io/assets/meta/og-cover.png">
  <meta property="og:image:secure_url" content="https://zottfoy.github.io/assets/meta/og-cover.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Zotrod 的个人主页：把复杂的东西，做得简单一点。">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Zotrod · 个人主页">
  <meta name="twitter:description" content="联系方式、听歌排行、在玩的游戏，以及一份透明的维修报价。">
  <meta name="twitter:image" content="https://zottfoy.github.io/assets/meta/og-cover.png">
  <meta name="twitter:image:alt" content="Zotrod 的个人主页">

  <title>Zotrod · 个人主页</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2316181a'/%3E%3Ctext x='32' y='44' font-size='38' font-family='Arial,Helvetica,sans-serif' font-weight='700' text-anchor='middle' fill='%23ffffff'%3EZ%3C/text%3E%3C/svg%3E">

  <!-- config.js 只定义数据，放最前面：既供下方主题初始化使用，也避免刷新闪白屏 -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/themes.js"></script>
  <script>
    /* 首屏立即套用主题，避免刷新时闪一下默认配色。
       这里只做「注入变量」这一件事，完整逻辑在 assets/js/skin.js。 */
    (function () {
      var d = document.documentElement;
      d.classList.add('js');
      try {
        var T = window.SITE_THEMES, UI = (window.SITE_CONFIG || {}).ui || {};
        var skinId = localStorage.getItem('zotrod-skin') || UI.skin || (T && T.defaultSkin) || 'ink';
        var skin = (T && T.get) ? T.get(skinId) : null;
        if (!skin && T && T.list && T.list.length) skin = T.list[0];

        var modeRaw = localStorage.getItem('zotrod-theme') || UI.themeDefault || 'auto';
        var dark = modeRaw === 'dark' ||
          (modeRaw === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        var mode = dark ? 'dark' : 'light';

        if (skin) {
          var b = skin.base || {}, c = skin[mode] || skin.light || {}, k, name;
          for (k in b) d.style.setProperty('--' + k, b[k]);
          for (k in c) d.style.setProperty('--' + k, c[k]);
          d.dataset.skin = skin.id;
        }
        d.dataset.theme = mode;
        d.dataset.modeRaw = modeRaw;
        /* 首帧前就声明配色方案：安卓 Edge 的自动深色会把浅色页反成深底，
           而带 mask-image 的列表不参与反色 —— 结果整块列表看起来是空的。
           `only light/dark` 让浏览器别插手，配色由我们自己管。 */
        d.style.colorScheme = (mode === 'dark') ? 'only dark' : 'only light';

        /* 载入动画：每次会话只出现一次；系统开了「减少动态效果」就跳过。
           放在内联脚本里判断，首帧前就定好，避免内容先闪一下再盖住。 */
        var live = (window.SITE_CONFIG || {}).live || {};
        var wantSplash = live.loading !== false &&
          !matchMedia('(prefers-reduced-motion: reduce)').matches;
        var seen = false;
        try { seen = sessionStorage.getItem('zotrod-splash') === '1'; } catch (err) {}
        d.dataset.loading = (wantSplash && !seen) ? '1' : '0';
        try { sessionStorage.setItem('zotrod-splash', '1'); } catch (err) {}
      } catch (e) {
        d.dataset.theme = 'light';
        d.dataset.skin = 'ink';
      }
    })();
  </script>

  <!-- defer：并行下载 + 顺序执行。config.js / themes.js 上面已同步加载，
       因为它们要给首屏内联脚本用；其余都在解析完成后、DOMContentLoaded 之前执行。 -->
  <script defer src="assets/js/icons.js"></script>
  <script defer src="assets/js/render.js"></script>
  <script defer src="assets/js/sync.js"></script>
  <script defer src="assets/js/scale.js"></script>
  <script defer src="assets/js/density.js"></script>
  <script defer src="assets/js/repair.js"></script>
  <script defer src="assets/js/skin.js"></script>
  <script defer src="assets/js/backdrop.js"></script>
  <script defer src="assets/js/live.js"></script>
  <script defer src="assets/js/steamwall.js"></script>
  <script defer src="assets/js/albumwall.js"></script>
  <!-- 预取闸门：等两面封面墙建好 DOM 之后，先把第 1/2 屏的图 decode 完再放行，
       第 3 屏并发预取。放在这两面墙之后，因为它要读它们的 <img>。 -->
  <script defer src="assets/js/preload.js"></script>
  <script defer src="assets/js/player.js"></script>
  <script defer src="assets/js/paged.js"></script>
  <script defer src="assets/js/readability.js"></script>
  <script defer src="assets/js/effects.js"></script>
  <script defer src="assets/js/motion.js"></script>
  <script defer src="assets/js/main.js"></script>

  <!-- 字体必须第一个：@font-face 越早被解析，首屏文字越快用上 MiSans。
       woff2 就在 assets/fonts/（随仓库走，不走外部 CDN），
       但仍按 unicode-range 分片声明，浏览器只下用得着的片。 -->
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/backdrop.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/blocks.css">
  <link rel="stylesheet" href="assets/css/skin.css">
  <link rel="stylesheet" href="assets/css/paged.css">
  <link rel="stylesheet" href="assets/css/gaming.css">
  <link rel="stylesheet" href="assets/css/fit.css">
  <link rel="stylesheet" href="assets/css/live.css">
  <link rel="stylesheet" href="assets/css/effects.css">
  <link rel="stylesheet" href="assets/css/motion.css">
  <!-- 视口密度分级：缩到某个阈值就让装饰退场，放大再回来 -->
  <link rel="stylesheet" href="assets/css/density.css">
  <!-- 字体与字重：覆盖前面散落的 font-weight 字面量。
       ⚠️ 必须在 unify.css **之前** —— unify 的职责是"最后一层收口"，
          自检脚本（verify-unify）也是按这个不变量断言的。
          unify.css 里没有任何 font-weight / font-family，
          所以放到它前面不会丢掉本文件的字重规则。 -->
  <link rel="stylesheet" href="assets/css/typography.css">
  <!-- 必须最后加载：它定义的是"白卡"这件事的最终值，
       前面几个文件里分散的圆角 / 阴影 / hover 写法会被它统一覆盖。 -->
  <link rel="stylesheet" href="assets/css/unify.css">
</head>

<body>
  <!-- 载入动画：只在首次进入时出现，最多 900ms，可点击跳过 -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash__inner">
      <span class="splash__mark">Z</span>
      <span class="splash__name">ZOTROD</span>
      <span class="splash__line"></span>
    </div>
  </div>
  <noscript><style>.splash { display: none !important; }</style></noscript>

  <a class="skip-link" href="#main">跳到主要内容</a>

  <div class="scroll-progress" aria-hidden="true"><span id="scrollProgressBar"></span></div>

  <!-- 背景系统：图片 → 遮罩 → 光晕 → 网格 → 微粒 → 噪点（全部在内容之下，不挡点击） -->
  <div class="ambient" id="ambient" aria-hidden="true">
    <span class="ambient__image" id="ambientImage"></span>
    <span class="ambient__scrim"></span>
    <span class="ambient__orb ambient__orb--a"></span>
    <span class="ambient__orb ambient__orb--b"></span>
    <span class="ambient__grid"></span>
    <span class="ambient__stars"></span>
    <span class="ambient__grain"></span>
  </div>

  <!-- 跟随指针的一团淡光（触屏设备不显示） -->
  <div class="spotlight" id="spotlight" aria-hidden="true"></div>

  <!-- 拖拽光效：按住时跟随的光团 + 拖尾点（点用对象池复用，不反复创建 DOM） -->
  <div class="drag-glow" id="dragGlow" aria-hidden="true"></div>
  <div class="drag-trail" id="dragTrail" aria-hidden="true"></div>
  <!-- 翻页时的光扫 -->
  <div class="page-sweep" aria-hidden="true"></div>

  <header class="site-header" id="siteHeader">
    <div class="container header__inner">
      <a class="brand" href="#top" aria-label="返回顶部">
        <span class="brand__mark" id="brandMark">Z</span>
        <span class="brand__name" id="brandName">Zotrod</span>
      </a>

      <nav class="nav" aria-label="主导航">
        <ul id="navList" class="nav__list"></ul>
      </nav>

      <!-- 三个按钮里先写死一份内联图标：render.js 会用主题色重画一遍，
           但**在 JS 跑起来之前（或图标签名失败时）按钮不能是空的** ——
           安卓 Edge 上首屏晚 1~2 秒很常见，空白按钮看起来就是"渲染坏了"。 -->
      <div class="header__actions">
        <button class="icon-btn" id="skinBtn" type="button"
                aria-label="更换风格" title="更换风格" aria-expanded="false" aria-controls="skinPanel"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.7 0-.9-.7-1.5-.7-2.3 0-.8.6-1.4 1.4-1.4H16a5 5 0 0 0 5-5c0-4.2-4-7.6-9-7.6Z"/><circle cx="7.5" cy="11.5" r="1"/><circle cx="11" cy="7.5" r="1"/><circle cx="15.5" cy="9" r="1"/></svg></button>
        <button class="icon-btn" id="themeToggle" type="button" aria-label="切换深浅" title="切换深浅"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="7" y2="7"/><line x1="17" y1="17" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="7" y2="17"/><line x1="17" y1="7" x2="19.1" y2="4.9"/></svg></button>
        <button class="icon-btn menu-toggle" id="menuToggle" type="button"
                aria-label="打开菜单" aria-expanded="false" aria-controls="mobileNav"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
      </div>
    </div>

    <!-- 风格切换面板 -->
    <div class="skin-panel" id="skinPanel" hidden>
      <div class="skin-panel__head">
        <div>
          <strong>风格</strong>
          <span class="skin-panel__count" id="skinCount"></span>
        </div>
        <button class="icon-btn icon-btn--xs" type="button" data-skin-close aria-label="关闭">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
        </button>
      </div>

      <div class="skin-panel__list" id="skinList" role="group" aria-label="可选风格"></div>

      <div class="skin-panel__foot">
        <span class="skin-panel__label">明暗</span>
        <div class="seg" role="group" aria-label="明暗模式">
          <button class="seg__btn" type="button" data-mode="light">浅色</button>
          <button class="seg__btn" type="button" data-mode="dark">深色</button>
          <button class="seg__btn" type="button" data-mode="auto">跟随系统</button>
        </div>
      </div>
    </div>
  </header>

  <nav class="mobile-nav" id="mobileNav" aria-label="移动端导航" hidden>
    <ul id="mobileNavList" class="mobile-nav__list"></ul>
    <p class="mobile-nav__foot" id="mobileNavFoot"></p>
  </nav>

  <!-- tabindex="-1" 让 <main> 可以被脚本聚焦。
       没有它的话，「跳到主要内容」只是把视口滚过去，键盘焦点还停在那条链接上 ——
       用户再按一次 Tab 会跳回页头第一个链接，等于白跳。
       这是 skip-link 能真正工作的前提。 -->
  <main id="main" tabindex="-1">

    <!-- ============================================================ Q1 · 我 -->
    <section class="hero" id="top" aria-labelledby="heroName">
      <div class="container hero__inner">

        <!-- 身份区：头像居中 + 名字居中（原来是左图右文，左右不平衡） -->
        <div class="profile">
          <div class="profile__avatar" id="heroAvatar" data-reveal hidden></div>

          <p class="profile__greet" id="heroGreet" data-reveal></p>
          <h1 class="profile__name" id="heroName" data-reveal style="--reveal-delay:60ms"></h1>
          <p class="profile__tagline" id="heroTagline" data-reveal style="--reveal-delay:110ms"></p>
          <p class="profile__role" id="heroRole" data-reveal style="--reveal-delay:150ms"></p>

          <!-- 第一行两列：左微信 / 右 QQ，点一下就复制 -->
          <div class="contact-pair" id="heroContacts" data-reveal style="--reveal-delay:210ms"></div>

          <!-- 第二行两列：左网易云 / 右小黑盒 -->
          <div class="preview-pair" id="heroPreviews" data-reveal style="--reveal-delay:260ms"></div>

          <p class="profile__intro" id="heroIntro" data-reveal style="--reveal-delay:300ms"></p>

          <div class="hero__actions" data-reveal style="--reveal-delay:340ms">
            <a class="btn btn--primary" id="heroPrimary" href="#listen"></a>
            <a class="btn btn--quiet" id="heroSecondary" href="#gaming"></a>
          </div>
        </div>

        <!-- 一言 / 时钟 / 进度：默认关闭（见 config.js 的 live），留骨架方便随时打开 -->
        <p class="hero__quote" id="liveQuote" hidden></p>
        <div class="hero__meta" id="liveMeta" hidden>
          <b id="liveClock">--:--</b>
          <span class="hero__meta__sep" aria-hidden="true">·</span>
          <span id="liveWeek"></span>
          <span id="liveDate"></span>
        </div>
        <div class="hero__progress" id="liveProgress" hidden>
          <span class="hero__progress__track" aria-hidden="true">
            <span class="hero__progress__fill" id="liveProgressFill"></span>
          </span>
          <span class="hero__progress__label" id="liveProgressLabel"></span>
        </div>
      </div>

      <div class="hero__scroll" aria-hidden="true">
        <span>向下翻页</span><span class="hero__scroll-line"></span>
      </div>
    </section>

    <div class="sections" id="sections">

      <!-- ====================================================== Q2 · 在听 -->
      <section class="section" id="listen" data-section="listen" aria-labelledby="listenTitle">
        <!-- 整屏的专辑封面墙：6 行，1/3/5 行左移、2/4/6 行右移，每周轮换。
             必须是 section 的直接子元素才能铺满一整屏 —— 放在 listen-card 里
             只会盖住卡片那一小块（第一版就是这么错的）。
             结构由 albumwall.js 填充，这里只留骨架。 -->
        <div class="albumwall" id="albumWall" aria-hidden="true">
          <div class="albumwall__grid" id="albumWallGrid"></div>
          <div class="albumwall__scrim"></div>
        </div>

        <div class="container">
          <header class="section__head" data-reveal>
            <p class="eyebrow" data-field="eyebrow"></p>
            <h2 class="section__title" id="listenTitle" data-field="title"></h2>
            <p class="section__lead" data-field="lead"></p>
          </header>

          <!-- 主卡片：容器本身透明，让整屏封面透出来；磁贴各自带实底保证可读 -->
          <div class="listen-card" id="listenCard">
            <div class="listen-card__body">
              <ul class="track-list" id="trackList" aria-label="最近在听"></ul>
              <p class="listen__foot" id="listenFoot"></p>
            </div>
          </div>
        </div>
      </section>

      <!-- ====================================================== Q3 · 游戏 -->
      <section class="section section--games" id="gaming" data-section="gaming" aria-labelledby="gamingTitle">
        <!-- Steam 封面拼贴背景（脚本填充图片）。
             aria-hidden + 无交互：它只是装饰，读屏与键盘都不该碰到它。
             放在 .container 之前，z-index 落在内容之下。 -->
        <div class="steamwall" id="steamWall" aria-hidden="true">
          <div class="steamwall__grid" id="steamWallGrid"></div>
          <div class="steamwall__scrim"></div>
        </div>
        <div class="container">
          <header class="section__head" data-reveal>
            <p class="eyebrow" data-field="eyebrow"></p>
            <h2 class="section__title" id="gamingTitle" data-field="title"></h2>
            <p class="section__lead" data-field="lead"></p>
          </header>
          <!-- 游戏模块：**整块是一个链接**（点哪都进 Steam 主页）。
               render.js 分两半填：
                 #gameRail  → 顶栏（平台名 / 公开库存 / 好友码）
                 #gameStats → 三格数据 + 游戏列表（可滚动，行数按可用高度算）
               数据来自 data/steam.json；抓不到时整块不渲染，不留空壳。 -->
          <a class="game-board" id="gameBoard" hidden target="_blank" rel="noopener noreferrer">
            <div class="game-rail" id="gameRail"></div>
            <div class="game-stats" id="gameStats" hidden></div>
          </a>
        </div>
      </section>

      <!-- ====================================================== Q4 · 维修 -->
      <section class="section" id="repair" data-section="repair" aria-labelledby="repairTitle">
        <div class="container">
          <header class="section__head section__head--tight" data-reveal>
            <p class="eyebrow" data-field="eyebrow"></p>
            <h2 class="section__title" id="repairTitle" data-field="title"></h2>
            <p class="section__lead" data-field="lead"></p>
          </header>

          <div class="repair">
            <!-- 左：闲鱼摘要卡 + 报价表 -->
            <div class="repair__left">
              <div class="preview-grid preview-grid--single" id="repairPreview"></div>
              <div class="quote" id="repairQuote"></div>
            </div>

            <!-- 右：四步估价器 -->
            <div class="calc" id="repairCalc"></div>
          </div>
        </div>
      </section>

      <!-- ====================================================== Q5 · 其他 -->
      <section class="section" id="links" data-section="links" aria-labelledby="linksTitle">
        <div class="container">
          <header class="section__head" data-reveal>
            <p class="eyebrow" data-field="eyebrow"></p>
            <h2 class="section__title" id="linksTitle" data-field="title"></h2>
            <p class="section__lead" data-field="lead"></p>
          </header>
          <div class="social-grid" id="linksGrid"></div>
        </div>
      </section>

      <!-- ====================================================== Q6 · 邮箱 -->
      <section class="section" id="contact" data-section="contact" aria-labelledby="contactTitle">
        <div class="container">
          <header class="section__head" data-reveal>
            <p class="eyebrow" data-field="eyebrow"></p>
            <h2 class="section__title" id="contactTitle" data-field="title"></h2>
            <p class="section__lead" data-field="lead"></p>
          </header>
          <div class="mailbox" id="contactBox" data-reveal></div>
        </div>
      </section>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer__inner">
      <div class="footer__brand">
        <span class="brand__mark brand__mark--sm" id="footerMark">Z</span>
        <span id="footerName">Zotrod</span>
      </div>
      <p class="footer__copy" id="footerCopy"></p>
      <p class="footer__note" id="footerNote"></p>
    </div>
  </footer>

  <button class="to-top" id="toTop" type="button" aria-label="回到顶部" title="回到顶部"></button>

  <!-- 音乐浮窗的挂载点（配置了音源或链接时才由 JS 生成内容） -->
  <div id="soundOn" hidden></div>

  <!-- 右侧页码：翻页模式下显示，可点击跳转；手机上变成底部细分段 -->
  <nav class="pager" id="pager" aria-label="页面导航">
    <ol class="pager__list" id="pagerList"></ol>
    <div class="pager__track" id="pagerTrack" aria-hidden="true"></div>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 首次进入时的翻页手势提示：动一下就消失，只出现一次 -->
  <div class="page-hint" id="pageHint" aria-hidden="true">
    <span>上下滑动翻页</span>
    <span class="page-hint__key">↓</span>
  </div>

  <!-- 无构建、无依赖：本地双击 index.html 也能直接看。
       JS 统一放在 head 里用 defer：浏览器在解析 HTML 的同时就能并行下载，
       执行顺序仍按上面的先后（defer 保证），不会打乱依赖。 -->
</body>
</html>
