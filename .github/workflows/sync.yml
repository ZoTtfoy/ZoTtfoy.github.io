name: Sync external data

# 抓取站外数据写进 data/*.json，然后提交回仓库。
# 抓不到不会导致失败 —— 页面会继续用 config.js 里的兜底内容。
#
# 首次使用需要配置两样东西（仓库 Settings → Secrets and variables → Actions）：
#   Secret   NETEASE_COOKIE  浏览器里 music.163.com 的完整 Cookie
#   Variable NETEASE_UID     你的数字 UID（或直接改 config.js 的 listen.neteaseUid）
#   Variable STEAM_ID        17 位 SteamID64（不填则读 config.js 里那张 Steam 卡）
#   注意：Steam 库存抓取需要本机浏览器（TLS 指纹），Actions 里跑不了，
#        所以这里只校验/沿用已有的 data/steam.json，不联网抓取。
#
# 不配置也能跑：会跳过网易云，只尝试抓外链摘要。

on:
  schedule:
    # 每天 UTC 02:10 / 北京时间 10:10。GitHub 的定时任务在高峰期可能延迟十几分钟，正常。
    - cron: "10 2 * * *"
  workflow_dispatch:        # 也可以在 Actions 页面手动点一下立刻跑

permissions:
  contents: write           # 需要写权限才能把 data/*.json 提交回来

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sync
        env:
          NETEASE_UID: ${{ vars.NETEASE_UID }}
          NETEASE_COOKIE: ${{ secrets.NETEASE_COOKIE }}
          # Steam：这里不联网抓（库存接口对裸 TLS 超时，必须用真实浏览器），
          # 只沿用仓库里 data/steam.json 的抓取结果。抓取在本机跑：
          #     node scripts/sync-steam.mjs
          STEAM_ID: ${{ vars.STEAM_ID }}
        run: node scripts/sync.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "数据没有变化，跳过提交"
          else
            git commit -m "chore(sync): 更新最近在听与主页摘要"
            git push
          fi
