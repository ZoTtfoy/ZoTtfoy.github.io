name: Sync external data

# 抓取站外数据写进 data/*.json，然后提交回仓库。
# 抓不到不会导致失败 —— 页面会继续用上一次的结果 / config.js 里的兜底内容。
#
# 首次使用需要配置（仓库 Settings → Secrets and variables → Actions）：
#   Secret   NETEASE_COOKIE    浏览器里 music.163.com 的完整 Cookie
#   Secret   STEAM_API_KEY     Steam Web API 密钥（免费领：steamcommunity.com/dev/apikey）
#   Variable NETEASE_UID       你的数字 UID（或直接改 config.js 的 listen.neteaseUid）
#   Variable STEAM_ID          17 位 SteamID64（不填则读 config.js 里那张 Steam 卡）
#
# 关于 Steam（2026-11-15 起全自动，不用再本机手跑）：
#   · 封面墙 apps / portraitApps 来自**公开库存接口**，不需要 API key、不需要登录，
#     但必须真实浏览器（裸 fetch 会被 TLS 指纹挡）。CI 里装 Playwright Chromium 即可。
#   · 战绩 / 总时长 / 最近入库走 Web API，用 Secret STEAM_API_KEY —— key 只存在于
#     这次 runner 的环境变量里，不进仓库、不进前端、不进日志。
#   · 一次 `node scripts/sync-steam.mjs` 同时做完上面两件事。
#   · 安全：key 绝不下放到浏览器；本工作流只由 schedule / workflow_dispatch 触发，
#     没有 pull_request_target，fork 的 PR 拿不到任何 secret。
#   · 容错：库存抓不到（限流/私密）时沿用旧封面墙，战绩照常更新；
#     竖版封面全部探测失败时也不会把墙清空。
#   · 「最近入库」靠两次同步的 appid 差集算（Steam 没有购买时间字段），所以每天必跑。
#
# 没配 STEAM_API_KEY 也能跑：封面墙照抓，战绩退回公开资料页。

on:
  schedule:
    # 每天 UTC 02:10 / 北京时间 10:10。GitHub 的定时任务在高峰期可能延迟十几分钟，正常。
    - cron: "10 2 * * *"
  workflow_dispatch:        # 也可以在 Actions 页面手动点一下立刻跑

permissions:
  contents: write           # 需要写权限才能把 data/*.json 提交回来

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 放到 job 层，是为了能在 step 的 if 里判断"密钥配了没"——
    # 按 GitHub 的规则，secrets 不能直接写进 if 表达式。
    env:
      NETEASE_UID: ${{ vars.NETEASE_UID }}
      NETEASE_COOKIE: ${{ secrets.NETEASE_COOKIE }}
      STEAM_ID: ${{ vars.STEAM_ID }}
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright Chromium
        # playwright（不是 core）自带配套版本的浏览器，install 一次即可。
        # --with-deps 会补齐 libgtk / libnss 等系统库，缺了在干净 runner 上必崩。
        run: |
          npm install --no-save playwright@1.65.0
          npx playwright install --with-deps chromium

      # 一次跑完：公开库存 → 封面墙；Web API → 战绩 / 总时长 / 最近入库。
      # 先跑 Steam，是因为「最近入库」每天都可能变，不该被后面网易云那条牵连。
      - name: Sync Steam（封面墙 + 战绩 + 最近入库）
        timeout-minutes: 15
        run: node scripts/sync-steam.mjs
        env:
          CI: true

      - name: Skip notice (no key)
        if: env.STEAM_API_KEY == ''
        run: echo "没有 STEAM_API_KEY：封面墙仍已抓取，战绩退回公开资料页（全库时长不可用）"

      - name: Run sync
        timeout-minutes: 10
        run: node scripts/sync.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "数据没有变化，跳过提交"
          else
            git commit -m "chore(sync): 更新封面墙 / 在听 / 游戏战绩 / 最近入库"
            git push
          fi
